<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tokoku · Modern Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: #f9fafc;
      color: #1e293b;
      line-height: 1.5;
      padding: 2rem 1.5rem;
    }

    .container { max-width: 1280px; margin: 0 auto; }

    /* HEADER */
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .logo {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #4f46e5, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo i {
      background: linear-gradient(135deg, #4f46e5, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 2rem;
    }

    .cart-icon {
      position: relative;
      background: white;
      width: 52px;
      height: 52px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 20px -8px rgba(0, 0, 0, 0.1);
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid #e2e8f0;
    }

    .cart-icon:hover {
      box-shadow: 0 15px 25px -8px rgba(79, 70, 229, 0.3);
      border-color: #c7d2fe;
    }

    .cart-icon i { font-size: 1.6rem; color: #1e293b; }

    .cart-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      background: #ef4444;
      color: white;
      font-size: 0.75rem;
      font-weight: 700;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid white;
    }

    /* KATEGORI */
    .kategori-section { margin-bottom: 2rem; }

    .kategori-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #334155;
    }

    .kategori-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    .kategori-btn {
      background: white;
      border: 1px solid #e2e8f0;
      padding: 0.6rem 1.2rem;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.88rem;
      color: #1e293b;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.02);
      font-family: inherit;
    }

    .kategori-btn i {
      color: #64748b;
      font-size: 0.9rem;
      transition: color 0.2s;
    }

    .kategori-btn:hover { background: #f1f5f9; border-color: #cbd5e1; }

    .kategori-btn.active {
      background: #4f46e5;
      border-color: #4f46e5;
      color: white;
      box-shadow: 0 10px 20px -8px #4f46e5;
    }

    .kategori-btn.active i { color: white; }

    /* PRODUK */
    .produk-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 1.5rem;
    }

    .produk-header h2 {
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #0f172a;
    }

    .produk-header span {
      font-size: 0.95rem;
      color: #64748b;
      background: #f1f5f9;
      padding: 0.3rem 0.9rem;
      border-radius: 40px;
    }

    .produk-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.8rem;
      margin-bottom: 3rem;
    }

    .produk-card {
      background: white;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 8px 20px -6px rgba(0, 0, 0, 0.05);
      transition: all 0.25s ease;
      border: 1px solid #f1f5f9;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .produk-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 25px 30px -12px rgba(79, 70, 229, 0.15);
      border-color: #e0e7ff;
    }

    .produk-img {
      background: #f1f5f9;
      height: 200px;
      overflow: hidden;
      position: relative;
    }

    .produk-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
      display: block;
    }

    .produk-card:hover .produk-img img { transform: scale(1.08); }

    .produk-info {
      padding: 1.3rem 1.2rem 1.5rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .produk-kategori {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #4f46e5;
      background: #eef2ff;
      padding: 0.2rem 0.7rem;
      border-radius: 40px;
      align-self: flex-start;
      margin-bottom: 0.8rem;
    }

    .produk-nama {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #0f172a;
      line-height: 1.3;
    }

    .produk-detail-singkat {
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 1.2rem;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .produk-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      gap: 0.5rem;
    }

    .produk-harga {
      font-weight: 700;
      font-size: 1.1rem;
      color: #0f172a;
      letter-spacing: -0.01em;
    }

    .btn-tambah {
      background: #4f46e5;
      border: none;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
      font-size: 1rem;
      box-shadow: 0 5px 12px -4px #4f46e5;
      flex-shrink: 0;
    }

    .btn-tambah:hover { background: #4338ca; transform: scale(1.05); }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s, visibility 0.25s;
      padding: 1rem;
    }

    .modal-overlay.active { opacity: 1; visibility: visible; }

    .modal-box {
      background: white;
      max-width: 460px;
      width: 100%;
      border-radius: 32px;
      padding: 2rem 1.8rem 2rem;
      box-shadow: 0 40px 60px -20px rgba(0, 0, 0, 0.3);
      position: relative;
      transform: scale(0.95);
      transition: transform 0.25s;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-overlay.active .modal-box { transform: scale(1); }

    .modal-close {
      position: absolute;
      top: 1.2rem;
      right: 1.2rem;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(4px);
      border: none;
      font-size: 1.5rem;
      color: #94a3b8;
      cursor: pointer;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: 0.2s;
      z-index: 2;
    }

    .modal-close:hover { background: #f1f5f9; color: #1e293b; }

    .modal-img {
      background: #f1f5f9;
      height: 220px;
      border-radius: 24px;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    .modal-img img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }

    .modal-kategori {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      color: #4f46e5;
      background: #eef2ff;
      padding: 0.2rem 0.8rem;
      border-radius: 40px;
      display: inline-block;
      margin-bottom: 0.8rem;
    }

    .modal-nama {
      font-size: 1.7rem;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 0.7rem;
      color: #0f172a;
    }

    .modal-deskripsi {
      color: #475569;
      font-size: 0.95rem;
      margin-bottom: 1.2rem;
      line-height: 1.6;
    }

    .modal-harga {
      font-size: 1.9rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 1.5rem;
      letter-spacing: -0.02em;
    }

    .modal-actions { display: flex; gap: 0.8rem; }

    .btn-modal-primary {
      flex: 2;
      background: #4f46e5;
      border: none;
      color: white;
      padding: 1rem 1.5rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 10px 20px -8px #4f46e5;
      font-family: inherit;
    }

    .btn-modal-primary:hover { background: #4338ca; transform: scale(1.01); }

    .btn-modal-secondary {
      flex: 1;
      background: white;
      border: 1.5px solid #e2e8f0;
      padding: 1rem 1rem;
      border-radius: 60px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      cursor: pointer;
      transition: 0.2s;
      color: #1e293b;
      font-family: inherit;
      font-size: 0.95rem;
    }

    .btn-modal-secondary:hover { background: #f8fafc; border-color: #cbd5e1; }

    /* KERANJANG */
    .cart-item {
      display: flex;
      gap: 1rem;
      align-items: center;
      padding: 1rem 0;
      border-bottom: 1px solid #f1f5f9;
    }

    .cart-item-img {
      width: 64px; height: 64px;
      border-radius: 16px;
      overflow: hidden;
      flex-shrink: 0;
      background: #f1f5f9;
    }

    .cart-item-img img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }

    .cart-item-detail { flex: 1; min-width: 0; }

    .cart-item-nama {
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 0.2rem;
      font-size: 0.92rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cart-item-harga {
      font-size: 0.82rem;
      color: #64748b;
      font-weight: 500;
    }

    .cart-item-qty {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.4rem;
    }

    .qty-btn {
      background: #f1f5f9;
      border: none;
      width: 26px; height: 26px;
      border-radius: 9px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
      color: #334155;
      font-family: inherit;
    }

    .qty-btn:hover { background: #e2e8f0; }

    .cart-item-subtotal {
      font-weight: 700;
      color: #0f172a;
      font-size: 0.9rem;
      min-width: 80px;
      text-align: right;
      flex-shrink: 0;
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      font-size: 1.2rem;
      font-weight: 700;
      margin: 1.5rem 0 1.2rem;
      padding-top: 1rem;
      border-top: 2px dashed #e2e8f0;
    }

    .empty-cart {
      text-align: center;
      padding: 2rem 0;
      color: #94a3b8;
      font-size: 1rem;
    }

    .empty-cart i {
      font-size: 3rem;
      margin-bottom: 0.5rem;
      opacity: 0.5;
      display: block;
    }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #0f172a;
      color: white;
      padding: 0.9rem 1.8rem;
      border-radius: 60px;
      font-weight: 500;
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.3);
      opacity: 0;
      transition: 0.3s;
      z-index: 2000;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      pointer-events: none;
      font-size: 0.9rem;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* RESPONSIVE */
    @media (max-width: 600px) {
      body { padding: 1.2rem; }
      .produk-grid { grid-template-columns: 1fr; }
      .modal-box { padding: 1.5rem; }
      .modal-nama { font-size: 1.4rem; }
      .modal-harga { font-size: 1.6rem; }
      .modal-actions { flex-direction: column; }
      .kategori-btn { font-size: 0.8rem; padding: 0.5rem 1rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- HEADER -->
    <header>
      <div class="logo">
        <i class="fas fa-bag-shopping"></i> Tokoku
      </div>
      <div class="cart-icon" id="cartIcon">
        <i class="fas fa-cart-shopping"></i>

    </header>

    <!-- KATEGORI: 10 KATEGORI -->
    <div class="kategori-section">
      <div class="kategori-title">
        <i class="fas fa-tag"></i> Kategori
      </div>
      <div class="kategori-list" id="kategoriList">
        <button class="kategori-btn active" data-kategori="semua"><i class="fas fa-star"></i> Semua</button>
        <button class="kategori-btn" data-kategori="handphone"><i class="fas fa-mobile-screen"></i> Handphone</button>
        <button class="kategori-btn" data-kategori="pakaian-pria"><i class="fas fa-user-tie"></i> Pakaian Pria</button>
        <button class="kategori-btn" data-kategori="aksesoris"><i class="fas fa-headphones"></i> Aksesoris</button>
        <button class="kategori-btn" data-kategori="kecantikan"><i class="fas fa-spa"></i> Kecantikan</button>
        <button class="kategori-btn" data-kategori="peralatan-rumah-tangga"><i class="fas fa-blender"></i> Peralatan Rumah Tangga</button>
        <button class="kategori-btn" data-kategori="pakaian-wanita"><i class="fas fa-person-dress"></i> Pakaian Wanita</button>
        <button class="kategori-btn" data-kategori="hobi-koleksi"><i class="fas fa-gamepad"></i> Hobi/Koleksi</button>
        <button class="kategori-btn" data-kategori="komputer"><i class="fas fa-laptop"></i> Komputer</button>
        <button class="kategori-btn" data-kategori="makanan"><i class="fas fa-utensils"></i> Makanan</button>
        <button class="kategori-btn" data-kategori="olahraga"><i class="fas fa-futbol"></i> Olahraga</button>
      </div>
    </div>

    <!-- PRODUK -->
    <div class="produk-header">
      <h2 id="produkTitle">Semua Produk</h2>
      <span id="produkCount">0 item</span>
    </div>
    <div class="produk-grid" id="produkGrid"></div>
  </div>

  <!-- MODAL DETAIL PRODUK -->
  <div class="modal-overlay" id="modalDetail">
    <div class="modal-box">
      <button class="modal-close" id="closeDetailModal"><i class="fas fa-times"></i></button>
      <div class="modal-img" id="detailModalImg"></div>
      <span class="modal-kategori" id="detailModalKategori"></span>
      <h2 class="modal-nama" id="detailModalNama"></h2>
      <p class="modal-deskripsi" id="detailModalDeskripsi"></p>
      <div class="modal-harga" id="detailModalHarga"></div>
      <div class="modal-actions">
        <button class="btn-modal-primary" id="detailModalAddBtn">
          <i class="fas fa-cart-plus"></i> Tambah ke Keranjang
        </button>
        <button class="btn-modal-secondary" id="detailModalCloseBtn">
          <i class="fas fa-arrow-left"></i> Kembali
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL KERANJANG -->
  <div class="modal-overlay" id="modalCart">
    <div class="modal-box">
      <button class="modal-close" id="closeCartModal"><i class="fas fa-times"></i></button>
      <h2 style="font-size: 1.7rem; font-weight: 700; margin-bottom: 1.2rem;">Keranjang <i class="fas fa-shopping-cart" style="color: #4f46e5;"></i></h2>
      <div id="cartItemsContainer"></div>
      <div class="cart-total">
        <span>Total</span>
        <span id="cartTotalAmount">Rp 0</span>
      </div>
      <button class="btn-modal-primary" style="width: 100%;" id="checkoutBtn">
        <i class="fas fa-credit-card"></i> Checkout
      </button>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast">
    <i class="fas fa-check-circle"></i> <span id="toastMessage">Produk ditambahkan</span>
  </div>

        { id: 16, nama: 'Dress Floral Wanita', kategori: 'pakaian-wanita', harga: 359000,

        { id: 17, nama: 'Blouse Kantor Wanita', kategori: 'pakaian-wanita', harga: 279000,

        // 7. HOBI/KOLEKSI
        { id: 19, nama: 'Action Figure Anime', kategori: 'hobi-koleksi', harga: 650000,

        // 9. MAKANAN
        { id: 25, nama: 'Kopi Arabika Premium', kategori: 'makanan', harga: 125000, 
          deskripsi: 'Kopi arabika single origin 250gr, roasting medium, aroma floral dan rasa seimbang.', 
          foto: 'https://images.unsplash.com/photo-1559056199-641a0ac8b55e?w=600&q=80' },
        { id: 26, nama: 'Cokelat Belgia', kategori: 'makanan', harga: 185000, 
          deskripsi: 'Cokelat Belgia premium dengan 70% cocoa, tekstur lembut, kemasan mewah untuk hadiah.',

          deskripsi: 'Madu hutan murni 500ml tanpa campuran, kaya antioksidan, cocok untuk kesehatan.', 
          foto: 'https://images.unsplash.com/photo-1587049352846-4a222e784d38?w=600&q=80' },

        // 10. OLAHRAGA
        { id: 28, nama: 'Sepatu Lari Pro', kategori: 'olahraga', harga: 890000, 
          deskripsi: 'Sepatu lari dengan bantalan responsif, upper mesh breathable, ideal untuk maraton.', 
          foto: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600&q=80' },
        { id: 29, nama: 'Dumbbell Set 20kg', kategori: 'olahraga', harga: 650000, 
          deskripsi: 'Set dumbbell adjustable 20kg dengan grip anti slip, untuk latihan di rumah.', 
          foto: 'https://images.unsplash.com/photo-1638536532686-d610adfc8e5c?w=600&q=80' },
        { id: 30, nama: 'Matras Yoga Premium', kategori: 'olahraga', harga: 220000, 
          deskripsi: 'Matras yoga anti slip tebal 8mm, nyaman untuk pilates dan meditasi, mudah digulung.', 
          foto: 'https://images.unsplash.com/photo-1601925260368-ae2f83cf8b7f?w=600&q=80' },
      ];

      let keranjang = [];
      let kategoriAktif = 'semua';
      let currentDetailProductId = null;

      // DOM
      const produkGrid = document.getElementById('produkGrid');
      const kategoriList = document.getElementById('kategoriList');
      const produkTitle = document.getElementById('produkTitle');
      const produkCount = document.getElementById('produkCount');
      const cartBadge = document.getElementById('cartBadge');
      const cartIcon = document.getElementById('cartIcon');
      const modalDetail = document.getElementById('modalDetail');
      const modalCart = document.getElementById('modalCart');
      const closeDetailModal = document.getElementById('closeDetailModal');
      const closeCartModal = document.getElementById('closeCartModal');
      const detailModalImg = document.getElementById('detailModalImg');
      const detailModalKategori = document.getElementById('detailModalKategori');
      const detailModalNama = document.getElementById('detailModalNama');
      const detailModalDeskripsi = document.getElementById('detailModalDeskripsi');
      const detailModalHarga = document.getElementById('detailModalHarga');
      const detailModalAddBtn = document.getElementById('detailModalAddBtn');
      const detailModalCloseBtn = document.getElementById('detailModalCloseBtn');
      const cartItemsContainer = document.getElementById('cartItemsContainer');
      const cartTotalAmount = document.getElementById('cartTotalAmount');
      const checkoutBtn = document.getElementById('checkoutBtn');
      const toast = document.getElementById('toast');
      const toastMessage = document.getElementById('toastMessage');

      // Nama kategori untuk tampilan
      const namaKategori = {
        'semua': 'Semua Produk',
        'handphone': 'Handphone',
        'pakaian-pria': 'Pakaian Pria',
        'aksesoris': 'Aksesoris',
        'kecantikan': 'Kecantikan',
        'peralatan-rumah-tangga': 'Peralatan Rumah Tangga',
        'pakaian-wanita': 'Pakaian Wanita',
        'hobi-koleksi': 'Hobi/Koleksi',
        'komputer': 'Komputer',
        'makanan': 'Makanan',
        'olahraga': 'Olahraga'
      };

      function formatRupiah(angka) {
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(angka);
      }

      function showToast(msg) {
        toastMessage.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      }

      function renderProduk() {
        let filtered = produkData;
        if (kategoriAktif !== 'semua') {
          filtered = produkData.filter(p => p.kategori === kategoriAktif);
        }
        produkTitle.textContent = namaKategori[kategoriAktif] || 'Semua Produk';
        produkCount.textContent = `${filtered.length} item`;

        if (filtered.length === 0) {
          produkGrid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: #94a3b8;">Tidak ada produk dalam kategori ini.</div>`;
          return;
        }

        produkGrid.innerHTML = filtered.map(p => `
          <div class="produk-card" data-id="${p.id}">
            <div class="produk-img">
              <img src="${p.foto}" alt="${p.nama}" loading="lazy" onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=\\'display:flex;align-items:center;justify-content:center;height:100%;font-size:3rem;color:#4f46e5;\\'><i class=\\'fas fa-image\\'></i></div>';">
            </div>
            <div class="produk-info">
              <span class="produk-kategori">${namaKategori[p.kategori] || p.kategori}</span>
              <h3 class="produk-nama">${p.nama}</h3>
              <p class="produk-detail-singkat">${p.deskripsi}</p>
              <div class="produk-footer">
                <span class="produk-harga">${formatRupiah(p.harga)}</span>
                <button class="btn-tambah" data-id="${p.id}" title="Tambah ke keranjang"><i class="fas fa-plus"></i></button>
              </div>
            </div>
          </div>
        `).join('');

        document.querySelectorAll('.produk-card').forEach(card => {
          card.addEventListener('click', (e) => {
            if (e.target.closest('.btn-tambah')) return;
            const id = parseInt(card.dataset.id);
            openDetailModal(id);
          });
        });

        document.querySelectorAll('.btn-tambah').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const id = parseInt(btn.dataset.id);
            tambahKeKeranjang(id, 1);
          });
        });
      }

      function openDetailModal(id) {
        const produk = produkData.find(p => p.id === id);
        if (!produk) return;
        currentDetailProductId = id;
        detailModalImg.innerHTML = `<img src="${produk.foto}" alt="${produk.nama}" onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=\\'display:flex;align-items:center;justify-content:center;height:100%;font-size:4rem;color:#4f46e5;\\'><i class=\\'fas fa-image\\'></i></div>';">`;
        detailModalKategori.textContent = namaKategori[produk.kategori] || produk.kategori;
        detailModalNama.textContent = produk.nama;
        detailModalDeskripsi.textContent = produk.deskripsi;
        detailModalHarga.textContent = formatRupiah(produk.harga);
        modalDetail.classList.add('active');
      }

      function tambahKeKeranjang(id, qty = 1) {
        const existing = keranjang.find(item => item.id === id);
        if (existing) {
          existing.qty += qty;
        } else {
          keranjang.push({ id, qty });
        }
        updateCartBadge();
        renderCartItems();
        const produk = produkData.find(p => p.id === id);
        showToast(`${produk.nama} ditambahkan ke keranjang`);
      }

      function updateCartBadge() {
        const totalQty = keranjang.reduce((sum, item) => sum + item.qty, 0);
        cartBadge.textContent = totalQty;
      }

      function renderCartItems() {
        if (keranjang.length === 0) {
          cartItemsContainer.innerHTML = `<div class="empty-cart"><i class="fas fa-box-open"></i>Keranjang masih kosong</div>`;
          cartTotalAmount.textContent = formatRupiah(0);
          return;
        }

        let total = 0;
        cartItemsContainer.innerHTML = keranjang.map(item => {
          const produk = produkData.find(p => p.id === item.id);
          const subtotal = produk.harga * item.qty;
          total += subtotal;
          return `
            <div class="cart-item" data-id="${produk.id}">
              <div class="cart-item-img">
                <img src="${produk.foto}" alt="${produk.nama}" onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=\\'display:flex;align-items:center;justify-content:center;height:100%;font-size:1.5rem;color:#4f46e5;\\'><i class=\\'fas fa-image\\'></i></div>';">
              </div>
              <div class="cart-item-detail">
                <div class="cart-item-nama">${produk.nama}</div>
                <div class="cart-item-harga">${formatRupiah(produk.harga)}</div>
                <div class="cart-item-qty">
                  <button class="qty-btn" data-id="${produk.id}" data-aksi="kurang">−</button>
                  <span style="font-weight:600; min-width:24px; text-align:center;">${item.qty}</span>
                  <button class="qty-btn" data-id="${produk.id}" data-aksi="tambah">+</button>
                </div>
              </div>
              <div class="cart-item-subtotal">${formatRupiah(subtotal)}</div>
            </div>
          `;
        }).join('');

        cartTotalAmount.textContent = formatRupiah(total);

        document.querySelectorAll('.qty-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const id = parseInt(btn.dataset.id);
            const aksi = btn.dataset.aksi;
            const item = keranjang.find(i => i.id === id);
            if (!item) return;
            if (aksi === 'tambah') item.qty += 1;
            else if (aksi === 'kurang') {
              item.qty -= 1;
              if (item.qty <= 0) keranjang = keranjang.filter(i => i.id !== id);
            }
            updateCartBadge();
            renderCartItems();
          });
        });
      }

      kategoriList.addEventListener('click', (e) => {
        const btn = e.target.closest('.kategori-btn');
        if (!btn) return;
        document.querySelectorAll('.kategori-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        kategoriAktif = btn.dataset.kategori;
        renderProduk();
      });

      detailModalAddBtn.addEventListener('click', () => {
        if (currentDetailProductId) {
          tambahKeKeranjang(currentDetailProductId, 1);
          modalDetail.classList.remove('active');
        }
      });
      closeDetailModal.addEventListener('click', () => modalDetail.classList.remove('active'));
      detailModalCloseBtn.addEventListener('click', () => modalDetail.classList.remove('active'));

      cartIcon.addEventListener('click', () => {
        renderCartItems();
        modalCart.classList.add('active');
      });
      closeCartModal.addEventListener('click', () => modalCart.classList.remove('active'));

      checkoutBtn.addEventListener('click', () => {
        if (keranjang.length === 0) { showToast('Keranjang masih kosong'); return; }
        keranjang = [];
        updateCartBadge();
        renderCartItems();
        modalCart.classList.remove('active');
        showToast('Checkout berhasil! Terima kasih 🎉');
      });

      window.addEventListener('click', (e) => {
        if (e.target === modalDetail) modalDetail.classList.remove('active');
        if (e.target === modalCart) modalCart.classList.remove('active');
      });

      renderProduk();
      updateCartBadge();
    })();
  </script>
</body>
